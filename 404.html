<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page introuvable | Nico Formation</title>
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --indigo: #5b6ef5; --indigo-dark: #4453d4; --ink: #1f2433; --muted: #5a6072; --paper: #faf9f7; --card: #ffffff; --line: #eceef3; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; background: var(--paper); color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.6; text-align: center; }
    .code { font-size: 0.85rem; font-weight: 600; color: var(--indigo); margin-bottom: 14px; }
    h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); font-weight: 800; line-height: 1.2; margin-bottom: 14px; }
    p { color: var(--muted); max-width: 460px; margin: 0 auto 30px; }
    a { display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 12px; background: var(--indigo); color: #fff; font-weight: 600; text-decoration: none; }
    a:hover { background: var(--indigo-dark); }
    a:focus-visible { outline: 3px solid var(--indigo); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code">Page introuvable</div>
    <h1>Cette page n'existe pas</h1>
    <p>Le lien est peut-être incomplet ou ancien. Toutes les informations sur les cours sont sur la page d'accueil.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
