<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Ouvrir Messages</title>
  <!-- Relais Telegram -> Messages. Telegram ne rend pas un lien sms: cliquable,
       un lien https oui. Le numéro et le texte voyagent dans le fragment (#),
       jamais envoyé au serveur ni aux journaux : pas de GA4 ici, exprès,
       pour ne pas faire entrer le téléphone d'un élève dans Analytics. -->
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#E8EAF6;color:#12152A}
    main{background:#fff;border-radius:16px;padding:28px 24px;max-width:360px;width:calc(100% - 32px);text-align:center}
    a.btn{display:block;background:#5B6EF5;color:#fff;text-decoration:none;font-weight:600;
      font-size:17px;padding:16px;border-radius:12px;margin-top:16px}
    p{color:#4A4F6A;font-size:15px;line-height:1.5;margin:0}
    pre{white-space:pre-wrap;text-align:left;background:#F4F5FB;border-radius:10px;padding:12px;
      font:14px/1.5 -apple-system,sans-serif;margin:16px 0 0}
  </style>
</head>
<body>
<main>
  <p id="msg">Ouverture de Messages…</p>
  <pre id="apercu" hidden></pre>
  <a class="btn" id="btn" href="#" hidden>Ouvrir Messages</a>
</main>
<script>
(function(){
  var p = new URLSearchParams(location.hash.slice(1));
  var to = (p.get('to') || '').replace(/[^\d+]/g, '');
  var body = p.get('body') || '';
  var msg = document.getElementById('msg');
  if (!to) { msg.textContent = 'Lien incomplet : numéro manquant.'; return; }
  var url = 'sms:' + to + '&body=' + encodeURIComponent(body).replace(/[()]/g, function(c){ return c === '(' ? '%28' : '%29'; });
  var btn = document.getElementById('btn');
  var apercu = document.getElementById('apercu');
  btn.href = url; btn.hidden = false;
  apercu.textContent = body; apercu.hidden = !body;
  msg.textContent = 'SMS pour ' + to + ' :';
  location.href = url;
})();
</script>
</body>
</html>
